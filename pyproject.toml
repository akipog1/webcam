[project]
name = "webcam-dart-scorer"
version = "2.4.0"
requires-python = ">=3.10"
dependencies = ["opencv-python>=4.8", "numpy>=1.24"]

[project.scripts]
dart-scorer = "dart_scorer.app:main"
dart-scorer-replay = "dart_scorer.replay:main"
dart-scorer-diagnostics = "dart_scorer.diagnostics:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
