[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "webcam-dart-scorer"
version = "2.4.0"
description = "Real-time steel-tip dart scoring with one or more webcams"
readme = "README.md"
license = "MIT"
authors = [{ name = "akipog1" }]
requires-python = ">=3.10"
dependencies = ["opencv-python>=4.8", "numpy>=1.24"]

[project.urls]
Homepage = "https://github.com/akipog1/webcam"
Repository = "https://github.com/akipog1/webcam"
Issues = "https://github.com/akipog1/webcam/issues"

[project.optional-dependencies]
test = ["pytest>=7"]
dev = ["ruff>=0.6"]

[project.scripts]
dart-scorer = "dart_scorer.app:main"
dart-scorer-replay = "dart_scorer.replay:main"
dart-scorer-diagnostics = "dart_scorer.diagnostics:main"

[tool.setuptools.packages.find]
include = ["dart_scorer*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
ignore = ["E501", "E702", "F401", "F841"]
